build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 10

naming:
  active: true
  FunctionNaming:
    # Allow uppercase (Compose) and underscore-prefixed (generated names like _90phaseTheme)
    functionPattern: '(_[0-9a-zA-Z]|[a-zA-Z])[a-zA-Z0-9]*'

style:
  active: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 6
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  UnusedImports:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
